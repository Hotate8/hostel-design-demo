<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HOSTEL｜メールアドレスの確認</title><link rel="stylesheet" href="assets/workflow.css?v=b97242af5cf0"><script src="assets/workflow.js?v=41d492ae6675" defer></script></head>
<body data-page="verify"><div id="verification-toast" class="toast" role="status" hidden><span>メールアドレスを確認しました。</span><button id="verification-toast-close" type="button" aria-label="確認メッセージを閉じる">閉じる</button></div><div class="review-bar"><a href="index.html">画面一覧・シナリオ</a><span>画面確認用・架空データ</span></div><div class="layout"><header><a class="brand" href="home.html">HOSTEL<span>.</span></a><a class="account-link" href="my-profile.html" id="account-label">ゲスト</a></header><main id="main"><p class="eyebrow">01 登録</p><h1>メールアドレスの確認</h1><p id="flash" class="flash" role="status" hidden></p><p id="storage-error" class="error" role="alert" hidden>デモの保存領域を利用できません。別のページへ入力を引き継ぐには、ローカルサーバーで開いてください。</p><p>確認コードの送信先：<strong id="verification-email">—</strong></p><p>届いた6桁のコードを入力してください。有効期限は10分です。</p><details><summary>確認用のデモメールを見る</summary><p>このデモのコード：<strong>042817</strong>（実メールは送信しません）</p></details><form data-action="verify"><fieldset class="code-fieldset"><legend>認証コード</legend><div class="code-boxes"><input name="code0" data-code-digit="0" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required autocomplete="one-time-code" aria-label="認証コード 1桁目"><input name="code1" data-code-digit="1" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required autocomplete="off" aria-label="認証コード 2桁目"><input name="code2" data-code-digit="2" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required autocomplete="off" aria-label="認証コード 3桁目"><input name="code3" data-code-digit="3" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required autocomplete="off" aria-label="認証コード 4桁目"><input name="code4" data-code-digit="4" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required autocomplete="off" aria-label="認証コード 5桁目"><input name="code5" data-code-digit="5" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required autocomplete="off" aria-label="認証コード 6桁目"></div></fieldset><p class="error" role="alert" hidden></p><button class="button" type="submit" disabled>認証する</button></form><button id="verification-resend" class="link" type="button" data-action="resend" disabled>コードを再送する</button><p id="resend-status" role="status"></p><button class="link" type="button" data-action="back-register">登録画面に戻る</button><details class="review-controls"><summary>確認用：認証・再送結果を切り替える</summary><label>次の認証<select id="verification-outcome"><option value="success">通常の照合</option><option value="failure">一度だけ通信・サーバーエラー</option></select></label><label>次の再送<select id="verification-resend-outcome"><option value="success">成功</option><option value="failure">一度だけ送信エラー</option></select></label></details></main><nav aria-label="メインナビゲーション"><a href="job-list.html">探す</a><a href="my-jobs.html">募集</a><a href="my-applications.html">応募</a><a href="messages.html">会話</a><a href="settings.html">設定</a></nav><footer>実際の登録・公開・応募・メール送信・金銭支払は行いません。<br><a href="index.html">フロー確認に戻る</a> · <a href="states.html">状態見本</a></footer></div></body></html>
