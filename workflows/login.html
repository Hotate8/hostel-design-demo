<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HOSTEL｜ログイン</title><link rel="stylesheet" href="assets/workflow.css"><script src="assets/workflow.js" defer></script></head>
<body data-page="login"><div class="review-bar"><a href="index.html">画面一覧・シナリオ</a><span>画面確認用・架空データ</span></div><div class="layout"><header><a class="brand" href="home.html">HOSTEL<span>.</span></a><a class="account-link" href="my-profile.html" id="account-label">ゲスト</a></header><main id="main"><p class="eyebrow">01 ログイン</p><h1>ログイン</h1><p id="flash" class="flash" role="status" hidden></p><p id="storage-error" class="error" role="alert" hidden>デモの保存領域を利用できません。別のページへ入力を引き継ぐには、ローカルサーバーで開いてください。</p><form data-action="login" novalidate><div class="field-group"><label for="login-email">メールアドレス</label><input id="login-email" name="email" type="email" required autocomplete="email" spellcheck="false" autocapitalize="none" aria-describedby="email-error"><p id="email-error" class="field-error" aria-live="polite" hidden></p></div><div class="field-group"><label for="login-password">パスワード</label><input id="login-password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-error"><p id="password-error" class="field-error" aria-live="polite" hidden></p></div><p id="login-request-error" class="error" role="alert" hidden></p><button id="login-submit" class="button" type="submit">ログイン</button><p id="login-status" role="status"></p></form><a class="link" href="password-request.html">パスワードを忘れた方 →</a><p class="registration-login">まだ会員でない方は <a href="register.html">会員登録へ →</a></p><details class="review-controls"><summary>確認用：送信結果を切り替える</summary><label>次のリクエスト<select id="login-outcome"><option value="success">成功</option><option value="credentials">認証エラー</option><option value="failure">一度だけ通信・サーバーエラー</option></select></label><p class="muted">架空の確認用です。実際の通信・パスワード認証・メール送信はありません。</p></details></main><nav aria-label="メインナビゲーション"><a href="job-list.html">探す</a><a href="my-jobs.html">募集</a><a href="my-applications.html">応募</a><a href="messages.html">会話</a><a href="settings.html">設定</a></nav><footer>実際の登録・公開・応募・メール送信・金銭支払は行いません。<br><a href="index.html">フロー確認に戻る</a> · <a href="states.html">状態見本</a></footer></div></body></html>
