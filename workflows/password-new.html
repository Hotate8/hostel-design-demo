<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HOSTEL｜新しいパスワードの設定</title><link rel="stylesheet" href="assets/workflow.css?v=b97242af5cf0"><script src="assets/workflow.js?v=41d492ae6675" defer></script></head>
<body data-page="password-new"><div id="verification-toast" class="toast" role="status" hidden><span>メールアドレスを確認しました。</span><button id="verification-toast-close" type="button" aria-label="確認メッセージを閉じる">閉じる</button></div><div class="review-bar"><a href="index.html">画面一覧・シナリオ</a><span>画面確認用・架空データ</span></div><div class="layout"><header><a class="brand" href="home.html">HOSTEL<span>.</span></a><a class="account-link" href="my-profile.html" id="account-label">ゲスト</a></header><main id="main"><p class="eyebrow">01 パスワード再設定</p><h1>新しいパスワードの設定</h1><p id="flash" class="flash" role="status" hidden></p><p id="storage-error" class="error" role="alert" hidden>デモの保存領域を利用できません。別のページへ入力を引き継ぐには、ローカルサーバーで開いてください。</p><aside class="proposal"><strong>フロー提案・確認待ち</strong><p>このデモではパスワードを保存・変更しません。</p></aside><form data-action="reset-password" novalidate><div class="field-group"><label for="reset-password">新しいパスワード</label><div class="password-control"><input id="reset-password" name="password" type="password" required autocomplete="new-password" aria-describedby="password-hint password-error"><button type="button" class="reveal" data-password-toggle="password" aria-controls="reset-password" aria-pressed="false">Show</button></div><small id="password-hint">15–64文字・スペース不可・英大文字と記号を各1つ以上。半角英数字・記号のみ。</small><p id="password-error" class="field-error" aria-live="polite" hidden></p></div><div class="field-group"><label for="reset-confirmation">新しいパスワード（確認）</label><div class="password-control"><input id="reset-confirmation" name="confirmation" type="password" required autocomplete="new-password" aria-describedby="confirmation-hint confirmation-error"><button type="button" class="reveal" data-password-toggle="confirmation" aria-controls="reset-confirmation" aria-pressed="false">Show</button></div><small id="confirmation-hint">上と同じパスワードを入力してください。</small><p id="confirmation-error" class="field-error" aria-live="polite" hidden></p></div><button id="reset-submit" class="button" type="submit" disabled>パスワードを変更</button></form><p class="registration-login"><a href="login.html">ログインへ戻る →</a></p></main><nav aria-label="メインナビゲーション"><a href="job-list.html">探す</a><a href="my-jobs.html">募集</a><a href="my-applications.html">応募</a><a href="messages.html">会話</a><a href="settings.html">設定</a></nav><footer>実際の登録・公開・応募・メール送信・金銭支払は行いません。<br><a href="index.html">フロー確認に戻る</a> · <a href="states.html">状態見本</a></footer></div></body></html>
