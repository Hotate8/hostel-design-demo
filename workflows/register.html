<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HOSTEL｜会員登録</title><link rel="stylesheet" href="assets/workflow.css?v=b97242af5cf0"><script src="assets/workflow.js?v=41d492ae6675" defer></script></head>
<body data-page="register"><div id="verification-toast" class="toast" role="status" hidden><span>メールアドレスを確認しました。</span><button id="verification-toast-close" type="button" aria-label="確認メッセージを閉じる">閉じる</button></div><div class="review-bar"><a href="index.html">画面一覧・シナリオ</a><span>画面確認用・架空データ</span></div><div class="layout"><header><a class="brand" href="home.html">HOSTEL<span>.</span></a><a class="account-link" href="my-profile.html" id="account-label">ゲスト</a></header><main id="main"><p class="eyebrow">01 登録</p><h1>会員登録</h1><p id="flash" class="flash" role="status" hidden></p><p id="storage-error" class="error" role="alert" hidden>デモの保存領域を利用できません。別のページへ入力を引き継ぐには、ローカルサーバーで開いてください。</p><form data-action="register" novalidate><div class="field-group"><label for="register-email">メールアドレス</label><input id="register-email" name="email" type="email" required autocomplete="email" spellcheck="false" autocapitalize="none" aria-describedby="email-error"><p id="email-error" class="field-error" aria-live="polite" hidden></p></div><div class="field-group"><label for="register-password">パスワード</label><div class="password-control"><input id="register-password" name="password" type="password" required autocomplete="new-password" aria-describedby="password-hint password-error"><button type="button" class="reveal" data-password-toggle="password" aria-controls="register-password" aria-pressed="false">Show</button></div><small id="password-hint">15–64文字・スペース不可・英大文字と記号を各1つ以上。半角英数字・記号のみ。</small><p id="password-error" class="field-error" aria-live="polite" hidden></p></div><div class="field-group"><label for="register-confirmation">パスワード（確認）</label><div class="password-control"><input id="register-confirmation" name="confirmation" type="password" required autocomplete="new-password" aria-describedby="confirmation-hint confirmation-error"><button type="button" class="reveal" data-password-toggle="confirmation" aria-controls="register-confirmation" aria-pressed="false">Show</button></div><small id="confirmation-hint">上と同じパスワードを入力してください。</small><p id="confirmation-error" class="field-error" aria-live="polite" hidden></p></div><p id="registration-request-error" class="error" role="alert" hidden></p><button id="register-submit" class="button" type="submit" disabled>会員登録</button><p id="registration-status" role="status" aria-live="polite"></p></form><p class="registration-login">すでに会員の方は <a href="login.html">ログインへ →</a></p><details class="review-controls"><summary>確認用：送信結果を切り替える</summary><label>次の登録リクエスト<select id="registration-outcome"><option value="success">成功</option><option value="failure">一度だけ通信エラー</option></select></label><p class="muted">画面確認用の送信シミュレーションです。実際の通信はありません。</p></details></main><nav aria-label="メインナビゲーション"><a href="job-list.html">探す</a><a href="my-jobs.html">募集</a><a href="my-applications.html">応募</a><a href="messages.html">会話</a><a href="settings.html">設定</a></nav><footer>実際の登録・公開・応募・メール送信・金銭支払は行いません。<br><a href="index.html">フロー確認に戻る</a> · <a href="states.html">状態見本</a></footer></div></body></html>
