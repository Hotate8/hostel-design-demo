<body data-page="invoice-new"><div id="verification-toast" class="toast" role="status" hidden><span>メールアドレスを確認しました。</span><button id="verification-toast-close" type="button" aria-label="確認メッセージを閉じる">閉じる</button></div><div class="review-bar"><a href="index.html">画面一覧・シナリオ</a><span>画面確認用・架空データ</span></div><div class="layout"><header><a class="brand" href="home.html">HOSTEL<span>.</span></a><a class="account-link" href="my-profile.html" id="account-label">ゲスト</a></header><main id="main"><p class="eyebrow">07 請求書</p><h1>仕事の対価を、伝える。</h1><p id="flash" class="flash" role="status" hidden></p><p id="storage-error" class="error" role="alert" hidden>デモの保存領域を利用できません。別のページへ入力を引き継ぐには、ローカルサーバーで開いてください。</p><aside class="proposal"><strong>フロー提案・確認待ち</strong><p>発行者・作成権限・作成時点・項目・金額/税計算・出力形式は未確定です。求人の日額から総額を自動計算しません。実情報は入力しないでください。</p></aside><form data-action="invoice"><label>発行者名 <span aria-hidden=true>*</span><input name="issuer" type="text" value="青木 あき" required></label><label>請求先 <span aria-hidden=true>*</span><input name="recipient" type="text" value="架空の制作チーム" required></label><label>件名 <span aria-hidden=true>*</span><input name="subject" type="text" value="撮影助手業務" required></label><label>請求金額（JPY） <span aria-hidden=true>*</span><input name="amount" type="number" value="30000" required></label><label>支払期日 <span aria-hidden=true>*</span><input name="due" type="date" value="2026-12-31" required></label><label>支払い案内<textarea name="instructions" rows="4" required>HOSTEL外でのお支払い方法を別途ご案内します。</textarea></label><p class="error" role="alert" hidden></p><button class="button" type="submit">請求書をプレビューする</button></form></main><nav aria-label="メインナビゲーション"><a href="job-list.html">探す</a><a href="my-jobs.html">募集</a><a href="my-applications.html">応募</a><a href="messages.html">会話</a><a href="settings.html">設定</a></nav><footer>実際の登録・公開・応募・メール送信・金銭支払は行いません。<br><a href="index.html">フロー確認に戻る</a> · <a href="states.html">状態見本</a></footer></div></body></html>
